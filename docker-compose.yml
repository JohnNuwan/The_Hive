name: the_hive
services:
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword} --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - hive-net
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD:-devpassword}
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
    networks:
      - hive-net
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'echo > /dev/tcp/localhost/6333'
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
  neo4j:
    image: neo4j:5-community
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-devpassword}
      - NEO4J_PLUGINS=["apoc"]
    networks:
      - hive-net
    volumes:
      - neo4j_data:/data
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    ports:
      - 5432:5432
    networks:
      - hive-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U eva -d thehive
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=eva
      - POSTGRES_PASSWORD=${TIMESCALE_PASSWORD:-devpassword}
      - POSTGRES_DB=thehive
      - PGHOST=/tmp
    command: postgres -c unix_socket_directories='/tmp'
    user: root
    volumes:
      - timescale_data:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - 1883:1883
    networks:
      - hive-net
    command: mosquitto -c /mosquitto-no-auth.conf
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mosquitto_data:/mosquitto/data
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
  vllm:
    image: vllm/vllm-openai:v0.5.4
    ports:
      - "8000:8000"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${VLLM_MODEL_NAME:-Qwen/Qwen2.5-1.5B-Instruct}
      - --dtype
      - half
      - --gpu-memory-utilization
      - "0.92"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.gpu == true
    volumes:
      - /mnt/data/ai_models/huggingface_cache:/root/.cache/huggingface
    networks:
      - hive-net

  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    ports:
      - "8188:8188"
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.gpu == true
    volumes:
      - ./data/comfyui/output:/opt/ComfyUI/output
      - ./data/comfyui/input:/opt/ComfyUI/input
      - ./data/comfyui/models:/opt/ComfyUI/models
      - ./data/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
    networks:
      - hive-net

  core:
    build:
      context: .
      dockerfile: src/eva-core/Dockerfile
    ports:
      - 8080:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - QDRANT_HOST=${HIVE_QDRANT_HOST:-qdrant}
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://${HIVE_NEO4J_HOST:-neo4j}:7687
      - NEO4J_HOST=${HIVE_NEO4J_HOST:-neo4j}
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
      - VLLM_HOST=${HIVE_VLLM_HOST:-vllm}
      - VLLM_PORT=${HIVE_VLLM_PORT:-8000}
      - COUNCIL_VLLM_HOST=${HIVE_VLLM_HOST:-vllm}
      - COUNCIL_VLLM_PORT=${HIVE_VLLM_PORT:-8000}
      - COUNCIL_MODEL_GENERAL=${COUNCIL_MODEL_GENERAL:-Qwen/Qwen2.5-1.5B-Instruct}
      - COUNCIL_MODEL_RESEARCH=${COUNCIL_MODEL_RESEARCH:-Qwen/Qwen2.5-1.5B-Instruct}
      - COUNCIL_MODEL_BANKER=${COUNCIL_MODEL_BANKER:-Qwen/Qwen2.5-1.5B-Instruct}
      - COUNCIL_MODEL_CODE=${COUNCIL_MODEL_CODE:-Qwen/Qwen2.5-1.5B-Instruct}
      - ENVIRONMENT=development
      - OLLAMA_HOST=${HIVE_OLLAMA_HOST:-host.docker.internal}
      - OLLAMA_PORT=11434
      - BANKER_API_HOST=${BANKER_API_HOST:-banker}
      - BANKER_API_PORT=${BANKER_API_PORT:-8100}
      - SENTINEL_API_HOST=${SENTINEL_API_HOST:-sentinel}
      - SENTINEL_API_PORT=${SENTINEL_API_PORT:-8200}
      - LAB_API_HOST=${LAB_API_HOST:-lab}
      - LAB_API_PORT=${LAB_API_PORT:-8600}
    deploy:
      #  GPU removed: core uses vLLM via REST API, not direct CUDA.
      # vLLM needs exclusive GPU access to avoid GetDeviceCount() failures.
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - hive-net
  kernel:
    build:
      context: .
      dockerfile: src/eva-kernel/Dockerfile
    ports:
      - 8800:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-devpassword}@${HIVE_REDIS_HOST:-redis}:6379
      #  MQTT via host.docker.internal pour eviter les soucis de resolution DNS inter-conteneurs.
      - MQTT_HOST=${HIVE_MQTT_HOST:-host.docker.internal}
      - MQTT_PORT=${HIVE_MQTT_PORT:-1883}
    volumes:
      - black_box:/mnt/black_box
      - ./data/tablet:/mnt/tablet:ro
    networks:
      - hive-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
  nervous:
    build:
      context: .
      dockerfile: src/eva-nervous/Dockerfile
    ports:
      - 9090:9090
      - 9091:9091
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  sentinel:
    build:
      context: .
      dockerfile: src/eva-sentinel/Dockerfile
    ports:
      - 8200:8200
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data/tablet:/mnt/tablet:ro
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  compliance:
    build:
      context: .
      dockerfile: src/eva-compliance/Dockerfile
    ports:
      - 8300:8300
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data/tablet:/mnt/tablet:ro
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  banker:
    build:
      context: .
      dockerfile: src/eva-banker/Dockerfile
    ports:
      - 8100:8100
    profiles:
      - with-banker
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - MOCK_MT5=${MOCK_MT5:-true}
      - PAPER_TRADING=${PAPER_TRADING:-true}
      - LAB_HOST=${LAB_HOST:-lab}
      - LAB_PORT=${LAB_PORT:-8600}
      - BANKER_LIVE_INFERENCE_URL=${BANKER_LIVE_INFERENCE_URL:-http://live-inference:8610}
      - BANKER_LIVE_INFERENCE_TIMEOUT_SECONDS=${BANKER_LIVE_INFERENCE_TIMEOUT_SECONDS:-5}
      - BANKER_TRAINING_COMPAT_MODE=${BANKER_TRAINING_COMPAT_MODE:-disabled}
      - BANKER_CPU_LIVE_SYMBOLS=${BANKER_CPU_LIVE_SYMBOLS:-EURUSD,GBPUSD,USDJPY,XAUUSD}
      - BANKER_CPU_LIVE_MAX_VOLUME=${BANKER_CPU_LIVE_MAX_VOLUME:-0.01}
      - BANKER_REQUIRE_VALID_CHAMPION=${BANKER_REQUIRE_VALID_CHAMPION:-true}
      - BANKER_LIMIT_TO_LAB_UNIVERSE=${BANKER_LIMIT_TO_LAB_UNIVERSE:-true}
      - BANKER_LAB_UNIVERSE_HORIZON=${BANKER_LAB_UNIVERSE_HORIZON:-scalp}
    networks:
      - hive-net
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: any
  substrate:
    build:
      context: .
      dockerfile: src/eva-substrate/Dockerfile
    ports:
      - 8400:8400
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
    networks:
      - hive-net
    restart: unless-stopped
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  accountant:
    build:
      context: .
      dockerfile: src/eva-accountant/Dockerfile
    ports:
      - 8500:8500
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  lab:
    build:
      context: .
      dockerfile: src/eva-lab/Dockerfile
    ports:
      - 8600:8600
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
      - CUDA_VISIBLE_DEVICES=
      - JAX_PLATFORMS=cpu
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
    networks:
      - hive-net
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities:
                  - gpu
        replicas: 1
        restart_policy:
          condition: any
        placement:
          constraints:
            - node.labels.gpu == true
    volumes:
      - ./data:/app/eva-lab/data
      # Monte le code source pour activer les champions live sans rebuild image.
      - ./src/eva-lab/eva_lab:/app/eva-lab/eva_lab:ro
  live-inference:
    build:
      context: .
      dockerfile: src/eva-lab/Dockerfile
    ports:
      - 8610:8610
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - CUDA_VISIBLE_DEVICES=
      - JAX_PLATFORMS=cpu
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - MUZERO_LIVE_SELECTION_POLICY=${MUZERO_LIVE_SELECTION_POLICY:-champion_only}
    command: ["uvicorn", "eva_lab.live_inference_main:app", "--host", "0.0.0.0", "--port", "8610"]
    networks:
      - hive-net
    restart: unless-stopped
    volumes:
      - ./data:/app/eva-lab/data
      - ./src/eva-lab/eva_lab:/app/eva-lab/eva_lab:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8610/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
  quant-lab:
    build:
      context: .
      dockerfile: src/eva-quant-lab/Dockerfile
    ports:
      - 8701:8701
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  rwa:
    build:
      context: .
      dockerfile: src/eva-rwa/Dockerfile
    ports:
      - 8700:8700
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  shadow:
    build:
      context: .
      dockerfile: src/eva-shadow/Dockerfile
    ports:
      - 8900:8900
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  builder:
    build:
      context: .
      dockerfile: src/eva-builder/Dockerfile
    ports:
      - 9000:9000
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
      - EVA_BUILDER_LLM_BACKEND=${EVA_BUILDER_LLM_BACKEND:-vllm}
      - EVA_BUILDER_LLM_URL=${EVA_BUILDER_LLM_URL:-http://vllm:8000/v1/chat/completions}
      - EVA_BUILDER_LLM_MODEL=${EVA_BUILDER_LLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      - EVA_BUILDER_PUBLIC_API_SOURCE_URL=${EVA_BUILDER_PUBLIC_API_SOURCE_URL:-https://raw.githubusercontent.com/public-apis/public-apis/master/README.md}
      - EVA_BUILDER_MUTATION_ENABLED=${EVA_BUILDER_MUTATION_ENABLED:-false}
      - EVA_BUILDER_DEPLOY_ENABLED=${EVA_BUILDER_DEPLOY_ENABLED:-false}
      - HIVE_SSH_HOST=${HIVE_SERVER_HOST:-192.168.1.6}
      - HIVE_SSH_USER=${HIVE_SSH_USER:-aza}
      - HIVE_SSH_PASSWORD=${HIVE_SSH_PASSWORD:-}
      - HIVE_SUDO_PASSWORD=${HIVE_SUDO_PASSWORD:-}
      - HIVE_REMOTE_DIR=${HIVE_REMOTE_DIR:-/home/aza/The_Hive}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - hive-net
    restart: unless-stopped
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  muse:
    build:
      context: .
      dockerfile: src/eva-muse/Dockerfile
    ports:
      - 9100:9100
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
      - COMFYUI_HOST=${HIVE_COMFYUI_HOST:-comfyui}
      - COMFYUI_PORT=8188
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_TOPIC_ID=${TELEGRAM_TOPIC_ID:-}
      - CIVITAI_API_KEY=${CIVITAI_API_KEY:-}
      - CORP_OWNER=${CORP_OWNER:-Azazel}
      - ENVIRONMENT=production
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  sage:
    build:
      context: .
      dockerfile: src/eva-sage/Dockerfile
    ports:
      - 9200:9200
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  researcher:
    build:
      context: .
      dockerfile: src/eva-researcher/Dockerfile
    ports:
      - 9300:9300
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - hive-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
  wraith:
    build:
      context: .
      dockerfile: src/eva-wraith/Dockerfile
    ports:
      - 9400:9400
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - LLM_BACKEND=${HIVE_LLM_BACKEND:-vllm}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - hive-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any
  nexus:
    build:
      context: src/eva-nexus
    ports:
      - 3030:80
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - hive-net
    volumes:
      - ./src/eva-nexus/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: any
  loki:
    image: grafana/loki:latest
    ports:
      - 3100:3100
    volumes:
      - ./infra/config/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - hive-net
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
  promtail:
    image: grafana/promtail:latest
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/config/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - hive-net
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - hive-net
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
  #  AI TRAINER (GPU  Run on demand via cron) 
  #   Ce service ne dmarre PAS automatiquement.
  # Il est invoqu par le cron noctune: docker compose run --rm eva-trainer
  # tape 1: GNN PyTorch (CUDA) | tape 2: MuZero/DreamerV3 (JAX)
  eva-trainer:
    build:
      context: .
      dockerfile: src/eva-lab/Dockerfile.trainer
    image: thehive/eva-trainer:latest
    environment:
      - REDIS_HOST=${HIVE_REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_SERVER=${MT5_SERVER:-FTMO-Demo}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_TOPIC_ID=${TELEGRAM_TOPIC_ID:-}
      - TELEGRAM_NOTIFY_TRAINING=${TELEGRAM_NOTIFY_TRAINING:-1}
      - CUDA_VISIBLE_DEVICES=0
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.9
    volumes:
      # Persistent named volume for all trained model weights
      - trainer_models:/app/eva-lab/data
      # Live code mounts (no container rebuild needed to change scripts)
      - ./src/eva-lab/scripts:/app/eva-lab/scripts
      - ./src/eva-lab/eva_lab:/app/eva-lab/eva_lab
    networks:
      - hive-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
      # restart: no = only runs when explicitly called (never auto-restart)
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.labels.gpu == true

networks:
  hive-net:
    driver: overlay
    attachable: true
volumes:
  black_box: null
  redis_data: null
  qdrant_data: null
  timescale_data: null
  mosquitto_data: null
  neo4j_data: null
  trainer_models: {}



