version: '3.8'

services:
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: eva_comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - /mnt/data/comfyui/output:/opt/ComfyUI/output
      - /mnt/data/comfyui/input:/opt/ComfyUI/input
      - /mnt/data/comfyui/models:/opt/ComfyUI/models
      - /mnt/data/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
