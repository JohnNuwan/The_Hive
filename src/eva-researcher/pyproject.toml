[project]
name = "eva-researcher"
version = "0.1.0"
description = "The Researcher - Agent de Recherche & Veille THE HIVE"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "yfinance>=0.2.36",
    "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["eva_researcher*"]
