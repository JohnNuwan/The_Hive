[project]
name = "eva-banker"
version = "0.1.0"
description = "The Banker - Agent Trading THE HIVE"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "metatrader5>=5.0.45; sys_platform == 'win32'",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "aiohttp>=3.9.0",
    "psycopg2-binary>=2.9.0",
    "torch_geometric>=2.5.0",
    "python-dateutil>=2.8.2",
    "ccxt>=4.2.0",
    "pytr>=0.4.6",
    "rich>=13.7.0"
]

[project.optional-dependencies]
follower-ui = [
    "customtkinter>=5.2.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
hive-follower-agent = "eva_banker.follower.cli:main"
hive-follower-relay = "eva_banker.follower.relay_server:main"
hive-follower-ui = "eva_banker.follower.ui:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["eva_banker*"]
