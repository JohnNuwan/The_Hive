server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/core/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/muse/ {
        proxy_pass http://host.docker.internal:9100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/kernel/ {
        proxy_pass http://host.docker.internal:8800/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    location /api/sentinel/ {
        proxy_pass http://host.docker.internal:8200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/compliance/ {
        proxy_pass http://host.docker.internal:8300/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/substrate/ {
        proxy_pass http://host.docker.internal:8400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/accountant/ {
        proxy_pass http://host.docker.internal:8500/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/lab/ {
        proxy_pass http://host.docker.internal:8600/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/rwa/ {
        proxy_pass http://host.docker.internal:8700/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/builder/ {
        proxy_pass http://host.docker.internal:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/quant-lab/ {
        proxy_pass http://host.docker.internal:8701/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/nervous/ {
        proxy_pass http://host.docker.internal:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/shadow/ {
        proxy_pass http://host.docker.internal:8900/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/sage/ {
        proxy_pass http://host.docker.internal:9200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/researcher/ {
        proxy_pass http://host.docker.internal:9300/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/wraith/ {
        proxy_pass http://host.docker.internal:9400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/hermes/health {
        proxy_pass http://host.docker.internal:9500/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location = /api/hermes/chat {
        proxy_pass http://host.docker.internal:9500/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/hermes/ {
        proxy_pass http://host.docker.internal:9500/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location = /api/banker/health {
        proxy_pass http://host.docker.internal:18101/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @banker_health_offline;
    }

    location = /api/banker/trading/status {
        proxy_pass http://host.docker.internal:18101/trading/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @banker_trading_status_offline;
    }

    location = /api/banker/nemesis/status {
        proxy_pass http://host.docker.internal:18101/nemesis/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @banker_nemesis_offline;
    }

    location = /api/banker/news/filter {
        proxy_pass http://host.docker.internal:18101/news/filter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @banker_news_filter_offline;
    }

    location = /api/banker/accounts/propfirm {
        proxy_pass http://host.docker.internal:18101/accounts/propfirm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @banker_propfirm_offline;
    }

    location = /api/banker/trading/auto {
        proxy_pass http://host.docker.internal:18101/trading/auto;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @banker_trading_auto_offline;
    }

    location = /api/banker/orders {
        proxy_pass http://host.docker.internal:18101/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @banker_orders_offline;
    }

    location ~ ^/api/banker/positions/ {
        proxy_pass http://host.docker.internal:18101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @banker_positions_offline;
    }

    location /api/banker/ {
        proxy_pass http://host.docker.internal:18101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @banker_health_offline {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"offline","service":"banker","reason":"banker_indisponible_sur_ce_serveur"}';
    }

    location @banker_trading_status_offline {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"account":{"equity":0,"balance":0,"margin":0,"currency":"USD"},"positions":[],"risk":{"daily_drawdown_percent":0,"trading_allowed":false},"decisions":{},"banker":{"status":"offline"}}';
    }

    location @banker_nemesis_offline {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"total_defeats":0,"known_nemeses":{},"trading_blocked":false,"blocked_until":null}';
    }

    location @banker_news_filter_offline {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"is_active":false,"blocked_until":null,"next_high_impact_events":[]}';
    }

    location @banker_propfirm_offline {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '[]';
    }

    location @banker_trading_auto_offline {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"offline","active":false,"message":"banker_indisponible_sur_ce_serveur"}';
    }

    location @banker_orders_offline {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"success":false,"message":"banker_indisponible_sur_ce_serveur"}';
    }

    location @banker_positions_offline {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"success":false,"message":"banker_indisponible_sur_ce_serveur"}';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
