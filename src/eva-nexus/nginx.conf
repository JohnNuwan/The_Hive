server {
    listen 80;
    server_name localhost;

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Resolver for Docker Swarm DNS (127.0.0.11)
    # The Swarm internal DNS resolves service names to Virtual IPs (VIPs) which then load balance across replicas.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ─── API Proxy Rules ───────────────────────────────────────────────────────
    # All backend services are on the hive-net Docker network.

    location ~* ^/api/core/(.*) {
        set $core_upstream core;
        proxy_pass http://$core_upstream:8080/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~* ^/api/muse/(.*) {
        set $muse_upstream muse;
        proxy_pass http://$muse_upstream:9100/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location ~* ^/api/kernel/(.*) {
        set $kernel_upstream kernel;
        proxy_pass http://$kernel_upstream:8080/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~* ^/api/sentinel/(.*) {
        set $sentinel_upstream sentinel;
        proxy_pass http://$sentinel_upstream:8200/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/api/compliance/(.*) {
        set $compliance_upstream compliance;
        proxy_pass http://$compliance_upstream:8300/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/api/substrate/(.*) {
        set $substrate_upstream substrate;
        proxy_pass http://$substrate_upstream:8400/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/api/accountant/(.*) {
        set $accountant_upstream accountant;
        proxy_pass http://$accountant_upstream:8500/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/api/lab/(.*) {
        set $lab_upstream lab;
        proxy_pass http://$lab_upstream:8600/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location ~* ^/api/rwa/(.*) {
        set $rwa_upstream rwa;
        proxy_pass http://$rwa_upstream:8700/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/api/quant-lab/(.*) {
        set $quant_lab_upstream quant-lab;
        proxy_pass http://$quant_lab_upstream:8701/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/api/shadow/(.*) {
        set $shadow_upstream shadow;
        proxy_pass http://$shadow_upstream:8900/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/api/sage/(.*) {
        set $sage_upstream sage;
        proxy_pass http://$sage_upstream:9200/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/api/researcher/(.*) {
        set $researcher_upstream researcher;
        proxy_pass http://$researcher_upstream:9300/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/api/wraith/(.*) {
        set $wraith_upstream wraith;
        proxy_pass http://$wraith_upstream:9400/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/banker/ {
        proxy_pass http://192.168.1.6:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Standard error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

