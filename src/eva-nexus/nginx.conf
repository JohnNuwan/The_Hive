server {
    listen 80;
    server_name localhost;

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Resolver for Docker DNS
    resolver 127.0.0.11 valid=30s;

    # API Proxy Rules
    # These routes are directed to the respective backend services in the Docker network

    location /api/core/ {
        set $upstream_core http://core:8080;
        proxy_pass $upstream_core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/banker/ {
        set $upstream_banker http://host.docker.internal:8100;
        proxy_pass $upstream_banker/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/sentinel/ {
        set $upstream_sentinel http://sentinel:8200;
        proxy_pass $upstream_sentinel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/compliance/ {
        set $upstream_compliance http://compliance:8300;
        proxy_pass $upstream_compliance/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/substrate/ {
        set $upstream_substrate http://substrate:8400;
        proxy_pass $upstream_substrate/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/accountant/ {
        set $upstream_accountant http://accountant:8500;
        proxy_pass $upstream_accountant/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/lab/ {
        set $upstream_lab http://lab:8600;
        proxy_pass $upstream_lab/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/rwa/ {
        set $upstream_rwa http://rwa:8700;
        proxy_pass $upstream_rwa/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/shadow/ {
        set $upstream_shadow http://shadow:8900;
        proxy_pass $upstream_shadow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/researcher/ {
        set $upstream_researcher http://researcher:9300;
        proxy_pass $upstream_researcher/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/wraith/ {
        set $upstream_wraith http://wraith:9400;
        proxy_pass $upstream_wraith/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/muse/ {
        set $upstream_muse http://muse:9100;
        proxy_pass $upstream_muse/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Handle /api/ without a trailing slash (optional, but good for consistency)
    location /api/ {
        return 404;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
