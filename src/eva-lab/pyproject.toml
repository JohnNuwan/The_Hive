[project]
name = "eva-lab"
version = "0.1.0"
description = "Laboratoire de R&D et d'auto-evolution pour E.V.A."
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "pandas",
    "python-dotenv",
    "jax",
    "jaxlib",
    "torch",
    "torch-geometric"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["eva_lab*"]